[project]
name = "football-prediction-market-data"
version = "0.1.0"
description = "Normalized Kalshi and Polymarket football market data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.2",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
build-football-data = "football_prediction_data.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_prediction_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
